<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>지금 낯선 · 대구 교동 혼술바</title>
<meta name="description" content="대구 교동 혼술바 낯·선의 지금 바 안 모습. 오늘 밤 손님들의 픽셀 캐릭터가 실시간으로 앉아 있어요.">
<meta property="og:title" content="지금 낯선 · 대구 교동 혼술바">
<meta property="og:description" content="오늘 밤 바 안의 모습을 실시간으로 보여드려요. 내 캐릭터가 바에 앉는 혼술바, 낯·선.">
<meta property="og:image" content="og.png">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Do+Hyeon&display=swap">
<style>
:root{--night:#0d090a;--line:#3a2a2b;--ink:#f6eee6;--muted:#b9a59c;--glow:#ffb27a;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--night);color:var(--ink);font-family:"Do Hyeon",system-ui,sans-serif}
main{min-height:100vh;display:grid;align-content:start;gap:14px;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-width:1100px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font:14px/1 "DotGothic16",monospace;color:var(--glow);letter-spacing:.12em}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff5a4a;margin-right:6px;animation:b 1.6s infinite}
@keyframes b{50%{opacity:.25}}
h1{margin:6px 0 0;font-size:clamp(24px,6vw,34px);line-height:1.2}
.status{margin:0;color:var(--glow);font-size:clamp(18px,4.6vw,22px)}
.stage{width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#0e0a0b}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.sub{margin:0;color:var(--muted);font-size:16px;line-height:1.5}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;text-align:center;padding:14px;border-radius:8px;font:18px/1.1 "Do Hyeon",sans-serif;background:#2a1d1f;color:var(--ink);border:1px solid var(--line);text-decoration:none}
.btn.primary{background:var(--glow);color:#1b0d0d;border-color:var(--glow)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (max-width:420px){.btns{grid-template-columns:1fr}}
.grecaptcha-badge{visibility:hidden}</style>
</head>
<body>
<main>
  <div class="top"><div class="brand"><span class="dot"></span>LIVE · NOTSUN</div></div>
  <div>
    <h1>지금 낯선은 이런 모습이에요</h1>
    <p class="status" id="status">불러오는 중…</p>
  </div>
  <div class="stage"><canvas id="scene"></canvas></div>
  <p class="sub">대구 교동 혼술바 <b style="font-weight:400;color:var(--ink)">낯·선</b>. 가게에서 QR을 찍으면 내 캐릭터가 이 바에 앉아요. 혼자 와도 어색하지 않은 곳이에요.</p>
  <div class="btns">
    <a class="btn primary" href="https://m.place.naver.com/restaurant/2062698801/home" target="_blank" rel="noopener">네이버 지도에서 보기 · 길찾기</a>
    <a class="btn" href="https://www.instagram.com/_notsun_daegu/" target="_blank" rel="noopener">인스타그램 @_notsun_daegu</a>
  </div>
  <p class="sub" style="font-size:13px">대구 중구 교동4길 33-20 1층 · 화면 속 캐릭터는 오늘 방문한 손님들이 직접 만든 거예요. 새벽 6시에 새로 시작돼요.</p>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
const N = window.Notsun, scene = document.getElementById('scene'), ctx = scene.getContext('2d'), view = N.createScene();
let day = N.bizDate(), guests = [], stop = null, ownerState = { owners: null, live: null, theme: 'auto', seats: {} };
N.watchOwner(st => ownerState = st);
var cheerList = [], cheerSeen = null, recName = '', gameActs = [], gameN = 0, gameOff = null;
setInterval(() => { const g = ownerState.game; const n = g ? g.n : 0; if (n !== gameN) { gameN = n; gameOff && gameOff(); gameActs = []; if (n) { const seen = {}; gameOff = N.watchGameActs(n, l => { const now = Date.now(); l.forEach(a => { seen[a.id] = seen[a.id] || a.ms || now; a.ms = seen[a.id]; }); gameActs = l; }); } } }, 300);
N.watchCheers(list => { const now = Date.now(); if (cheerSeen) list.filter(c => !cheerSeen.has(c.id)).forEach(c => cheerList.push({ id: c.id, to: c.to, ms: now }));
  cheerSeen = new Set(list.map(c => c.id)); cheerList = cheerList.filter(c => now - c.ms < 6000); });
N.watchMenu(cats => { recName = cats.flatMap(c => c.items).filter(it => it.rec && !it.soldout).map(it => it.name).slice(0, 2).join(', '); });
function subscribe(){ stop && stop(); stop = N.watchGuests(day, list => { if (list) guests = list; status(); }); }
function status(){
  const n = guests.length, h = new Date().getHours();
  document.getElementById('status').textContent = n ? `오늘 밤 ${n}명의 낯선 손님이 바에 앉았어요` : (h >= 6 && h < 17 ? '오늘 밤 첫 손님을 기다리는 중이에요' : '오늘 첫 손님을 기다리는 중이에요. 첫 번째 손님이 되어주세요!');
}
subscribe(); status();
const bootDay = N.bizDate(); setInterval(() => { if (N.bizDate() !== bootDay) N.safeReload('live.html'); }, 60000);   // 새벽 6시 영업일이 바뀌면 깨끗하게 새로 시작
function fit(){ const r = scene.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); scene.width = Math.round(r.width * dpr); scene.height = Math.round(r.height * dpr); }
addEventListener('resize', fit); fit();
function loop(t){
  if (N.bizDate() !== day) { day = N.bizDate(); guests = []; subscribe(); }
  const npcs = ownerState.npcs || [], all = npcs.length ? guests.concat(npcs).sort((a, b) => (a.ms || 0) - (b.ms || 0)) : guests;
  view.render(ctx, scene.width, scene.height, all, t, { day, count: all.length, qr: null, owners: ownerState.owners, live: ownerState.live, seats: ownerState.seats,
    order: ownerState.order, served: ownerState.served, bday: ownerState.bday, bdays: ownerState.bdays, lucky: ownerState.lucky, best: ownerState.best, vip: ownerState.vip, q: ownerState.q, rec: recName, cheers: cheerList, game: ownerState.game, gameActs, theme: N.resolveTheme(ownerState.theme), screenTitle: '지금 낯선 손님들', footer: guests.length ? '' : '첫 번째 낯선 손님을 기다리는 중' });
  requestAnimationFrame(loop);
}
(document.fonts ? document.fonts.load('20px "Do Hyeon"').catch(() => {}) : Promise.resolve()).finally(() => requestAnimationFrame(loop));
</script>
</body>
</html>
